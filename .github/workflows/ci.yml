name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    # Pinned so the image (and its Chrome) only changes when we choose to.
    runs-on: ubuntu-24.04
    steps:
      # Actions are pinned to release commits (GitHub's hardening guidance).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      # The Firestore emulator (rules tests) runs on Java.
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  # Every push to main that passes the build goes to the test folder.
  deploy-test:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    uses: ./.github/workflows/ftp-upload.yml
    with:
      environment: test
      target-dir: /public_html/dyp/tst
      url: https://calgaryfoosballclub.com/dyp/tst/
      artifact: dist
      commit: ${{ github.sha }}
