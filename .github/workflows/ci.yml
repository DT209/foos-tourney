name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    # Pinned so the image (and its Chrome) only changes when we choose to.
    runs-on: ubuntu-24.04
    steps:
      # Actions are pinned to release commits (GitHub's hardening guidance).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
