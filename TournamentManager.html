<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calgary Foosball Club - Tournament Manager</title>

  <!-- SEO & Social Meta Tags -->
  <meta name="description" content="Official Calgary Foosball Club Tournament Manager for monster draw and bracket playoff management.">
  <meta name="keywords" content="Calgary Foosball, Foosball Tournament, Table Soccer, Matchmaking, Brackets">
  <meta name="author" content="Calgary Foosball Club">

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Calgary Foosball Club - Tournament Manager">
  <meta property="og:description" content="Manage monster draws, fair matchmaking, leaderboards, and playoff brackets.">
  <meta property="og:image" content="https://calgaryfoosballclub.com/wp-content/uploads/2023/11/calgary-foosball-club-logo.png">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Calgary Foosball Club - Tournament Manager">
  <meta name="twitter:description" content="Manage monster draws, fair matchmaking, leaderboards, and playoff brackets.">
  <meta property="twitter:image" content="https://calgaryfoosballclub.com/wp-content/uploads/2023/11/calgary-foosball-club-logo.png">

  <!-- React & Babel CDNs -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            cfc: {
              red: '#d12328',
              redHover: '#b81c21',
              dark: '#0e1015',
              panel: '#181b22',
              panelLight: '#222731',
              border: '#2e3543',
              text: '#f3f4f6'
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-cfc-dark text-cfc-text min-h-screen font-sans selection:bg-cfc-red selection:text-white flex flex-col justify-between">
  <div id="root" class="w-full min-h-screen flex flex-col justify-between"></div>

  <!-- Tournament logic (plain JS, no build step) -->
  <script src="tournament-logic.js"></script>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // All tournament behaviour lives in tournament-logic.js (tested under test/).
    const {
      sanitizeInput, checkPin, getLeaderboardInfo, fetchLeaderboardPlayers, FALLBACK_LEADERBOARD_PLAYERS,
      checkNewPlayerName, addPlayer, addPlayersByName, togglePlayerFlag, renamePlayer, removePlayer,
      countActivePlayers, hasPausedPlayers, computeStandings,
      togglePickerSelection, getLeaderboardPickerView, toggleSelectAll, getPlayerSuggestions,
      drawMonsterMatch, deleteMatch, updateMonsterGameScore, setMonsterHandicap, setMonsterOverrideWinner,
      getMatchWinner, completeMonsterMatch, findLiveMatchAtTable, teamLabel,
      buildManualTeams, getManualTeamCandidates, setManualTeamPlayer, parseTeamCountInput,
      createBracket, clearMatchResults,
      updateBracketGameScore, setBracketHandicap, setBracketOverrideWinner, confirmBracketMatch,
      calculateBracketStandings, placeLabel, placeMedal, assignBracketTables, getMatchCardState, bracketTeamName,
      getCompletedMatchesList, formatHistoryRow, buildCsv, csvFileName, downloadCsv, todayIsoDate
    } = window.TournamentLogic;

    // ==========================================
    // REUSABLE MATCH CARD COMPONENT FOR BRACKET
    // ==========================================

    function MatchCard({ match, onScoreChange, onHandicapToggle, onOverrideWinnerChange, onConfirm, locked }) {
      if (!match) return null;

      const t1Name = bracketTeamName(match.team1);
      const t2Name = bracketTeamName(match.team2);
      const calculatedWinner = getMatchWinner(match);

      // Dynamic Border Color Logic based on Match State
      const borderColor = {
        done: 'border-emerald-500',
        tabled: 'border-purple-600',
        ready: 'border-rose-600',
        pending: 'border-cfc-border'
      }[getMatchCardState(match)];

      return (
        <div className={`bg-cfc-dark p-3.5 rounded-lg border-2 ${borderColor} space-y-3 shadow-md relative`}>
          <div className="flex justify-between items-center text-xs border-b border-cfc-border/60 pb-1.5">
            <span className="font-bold text-gray-300">{match.label || `Match ${match.num}`}</span>
            {match.status === 'DONE' ? (
              <span className="bg-emerald-950/80 text-emerald-400 border border-emerald-700 text-[10px] px-2 py-0.5 rounded font-bold uppercase tracking-wider">
                ✓ Complete
              </span>
            ) : match.table && (
              <span className="bg-purple-950/80 text-purple-300 border border-purple-700 text-[10px] px-2 py-0.5 rounded font-bold uppercase tracking-wider">
                Table #{match.table}
              </span>
            )}
          </div>

          <div className="space-y-1.5 text-xs">
            <div className={`p-2 rounded flex justify-between items-center ${match.winner === 1 ? 'bg-emerald-950/60 border border-emerald-700/80 font-bold text-white' : 'bg-cfc-panel border border-cfc-border text-gray-300'}`}>
              <span className="truncate pr-2">{t1Name}</span>
              {match.winner === 1 && <span className="text-emerald-400 text-xs">✓ Winner</span>}
            </div>

            <div className={`p-2 rounded flex justify-between items-center ${match.winner === 2 ? 'bg-emerald-950/60 border border-emerald-700/80 font-bold text-white' : 'bg-cfc-panel border border-cfc-border text-gray-300'}`}>
              <span className="truncate pr-2">{t2Name}</span>
              {match.winner === 2 && <span className="text-emerald-400 text-xs">✓ Winner</span>}
            </div>
          </div>

          {match.status !== 'DONE' && (
            <div className="space-y-2 pt-1 border-t border-cfc-border/60">
              <div className="space-y-1.5">
                {match.games.map((g, gIdx) => (
                  <div key={gIdx} className="flex items-center justify-between text-xs gap-2">
                    <span className="text-gray-400 font-mono text-[11px]">Game #{gIdx + 1}:</span>
                    <div className="flex items-center gap-1.5">
                      <input
                        type="number" min="0" max="99"
                        value={g.t1}
                        onChange={e => onScoreChange(gIdx, 't1', e.target.value)}
                        disabled={locked}
                        className="w-12 bg-cfc-panel border border-cfc-border text-center rounded py-0.5 text-white font-bold focus:outline-none focus:border-cfc-red disabled:opacity-50"
                      />
                      <span className="text-gray-500 font-bold">-</span>
                      <input
                        type="number" min="0" max="99"
                        value={g.t2}
                        onChange={e => onScoreChange(gIdx, 't2', e.target.value)}
                        disabled={locked}
                        className="w-12 bg-cfc-panel border border-cfc-border text-center rounded py-0.5 text-white font-bold focus:outline-none focus:border-cfc-red disabled:opacity-50"
                      />
                    </div>
                  </div>
                ))}
              </div>

              <div className="flex items-center justify-between text-[11px] pt-1">
                <label className="flex items-center gap-1.5 cursor-pointer text-gray-400">
                  <input
                    type="checkbox"
                    checked={match.isHandicap || false}
                    onChange={e => onHandicapToggle(e.target.checked)}
                    disabled={locked}
                    className="rounded border-cfc-border bg-cfc-dark text-cfc-red focus:ring-0 disabled:opacity-50"
                  />
                  Handicap / Override
                </label>

                {match.isHandicap && (
                  <select
                    value={match.overrideWinner || 1}
                    onChange={e => onOverrideWinnerChange(e.target.value)}
                    disabled={locked}
                    className="bg-cfc-panel border border-cfc-border rounded px-1.5 py-0.5 text-cfc-red font-semibold text-[11px] disabled:opacity-50"
                  >
                    <option value="1">Team 1 Wins</option>
                    <option value="2">Team 2 Wins</option>
                  </select>
                )}
              </div>

              <button
                onClick={onConfirm}
                disabled={!calculatedWinner || locked}
                className={`w-full py-1.5 rounded font-bold text-xs uppercase tracking-wider transition ${
                  calculatedWinner && !locked
                    ? 'bg-emerald-600 hover:bg-emerald-500 text-white shadow-md'
                    : 'bg-cfc-panel border border-cfc-border text-gray-500 cursor-not-allowed'
                }`}
              >
                {calculatedWinner ? `Confirm (Winner: Team ${calculatedWinner})` : 'Enter Winner Scores'}
              </button>
            </div>
          )}
        </div>
      );
    }

    // ==========================================
    // MAIN REACT APPLICATION
    // ==========================================

    function FoosballApp() {
      // Configuration State
      const [tournamentName, setTournamentName] = useState('Thursday DYP');
      const [startDate] = useState(() => todayIsoDate());
      const [tableCount, setTableCount] = useState(2);
      const [format, setFormat] = useState('2v2');
      const [maxGames, setMaxGames] = useState(3);
      const [activeTab, setActiveTab] = useState('pool');
      const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);
      const [showClearMatchesWarning, setShowClearMatchesWarning] = useState(false);
      const [showFullResetWarning, setShowFullResetWarning] = useState(false);
      
      // Admin Lock State - tool is fully unlocked (editable) by default.
      // Entering the correct PIN toggles between full access and View Only mode.
      const [adminPin] = useState('1234');
      const [isLocked, setIsLocked] = useState(false);
      const [pinInput, setPinInput] = useState('');
      const [showPinModal, setShowPinModal] = useState(false);

      // Player State
      const [players, setPlayers] = useState([]);
      const [newPlayerName, setNewPlayerName] = useState('');
      const [editingPlayerId, setEditingPlayerId] = useState(null);
      const [editingName, setEditingName] = useState('');
      const [pendingCustomPlayerName, setPendingCustomPlayerName] = useState(null);
      const [showLeaderboardPicker, setShowLeaderboardPicker] = useState(false);
      const [pickerSelection, setPickerSelection] = useState([]);
      const [showPlayerSuggestions, setShowPlayerSuggestions] = useState(false);
      const [openActionMenuId, setOpenActionMenuId] = useState(null);

      // Club Leaderboard - starts from the bundled fallback snapshot, then
      // upgraded to a live pull once the fetch below resolves.
      const [leaderboardPlayers, setLeaderboardPlayers] = useState(FALLBACK_LEADERBOARD_PLAYERS);
      const [leaderboardStatus, setLeaderboardStatus] = useState('cached');

      useEffect(() => {
        let cancelled = false;
        fetchLeaderboardPlayers()
          .then(players => {
            if (cancelled) return;
            setLeaderboardPlayers(players);
            setLeaderboardStatus('live');
          })
          .catch(() => {
            if (!cancelled) setLeaderboardStatus('cached');
          });
        return () => { cancelled = true; };
      }, []);

      // Matches & Bracket State
      const [matches, setMatches] = useState([]);
      const [showBracketModal, setShowBracketModal] = useState(false);
      const [bracketTeamCount, setBracketTeamCount] = useState(4);
      const [bracketElimType, setBracketElimType] = useState('single');
      const [bracketMaxGames, setBracketMaxGames] = useState(3);
      const [teamFormationStrategy, setTeamFormationStrategy] = useState('fair');
      const [seedingStrategy, setSeedingStrategy] = useState('ranking');
      const [bracketData, setBracketData] = useState(null);
      const [customTeams, setCustomTeams] = useState([]);
      const [showWinnerModal, setShowWinnerModal] = useState(false);
      const [showPausedWarningModal, setShowPausedWarningModal] = useState(false);

      // --- ADMIN LOCK / VIEW ONLY TOGGLE ---
      const handlePinSubmit = (e) => {
        e.preventDefault();
        if (checkPin(pinInput, adminPin)) {
          setIsLocked(prev => !prev);
          setShowPinModal(false);
          setPinInput('');
        } else {
          alert('Incorrect PIN!');
          setPinInput('');
        }
      };

      // --- PLAYER ACTIONS ---
      const addPlayerToRoster = (cleanName) => {
        setPlayers(prev => addPlayer(prev, Date.now(), cleanName));
        setNewPlayerName('');
      };

      const handleAddPlayer = (e) => {
        e.preventDefault();
        const check = checkNewPlayerName(newPlayerName, players, leaderboardPlayers);
        if (check.error) {
          alert(check.error);
          return;
        }

        if (check.onLeaderboard) {
          addPlayerToRoster(check.name);
        } else {
          // Not an exact match on the club leaderboard - confirm before adding as a guest/custom player.
          setPendingCustomPlayerName(check.name);
        }
      };

      const confirmAddCustomPlayer = () => {
        if (pendingCustomPlayerName) {
          addPlayerToRoster(pendingCustomPlayerName);
        }
        setPendingCustomPlayerName(null);
      };

      // --- BULK ADD FROM CLUB LEADERBOARD ---
      const openLeaderboardPicker = () => {
        setPickerSelection([]);
        setShowLeaderboardPicker(true);
      };

      const togglePickerName = (name) => {
        setPickerSelection(prev => togglePickerSelection(prev, name));
      };

      const addPickedPlayers = () => {
        if (pickerSelection.length === 0) return;
        const baseId = Date.now();
        setPlayers(prev => addPlayersByName(prev, pickerSelection, baseId));
        setShowLeaderboardPicker(false);
        setPickerSelection([]);
      };

      const togglePaid = (id) => {
        setPlayers(togglePlayerFlag(players, id, 'paid'));
      };

      const toggleActive = (id) => {
        setPlayers(togglePlayerFlag(players, id, 'active'));
      };

      const startEditingPlayer = (player) => {
        setEditingPlayerId(player.id);
        setEditingName(player.name);
      };

      const savePlayerName = (id) => {
        setPlayers(renamePlayer(players, id, editingName));
        setEditingPlayerId(null);
      };

      const handleRemovePlayer = (id) => {
        if (confirm('Are you sure you want to remove this player? Historical match records will be preserved.')) {
          setPlayers(removePlayer(players, id));
        }
      };

      // --- TOURNAMENT RESET ACTIONS ---
      const resetMatchesOnly = () => {
        // If a bracket exists, it's rebuilt from the same teams/seeding so Round 1
        // (structure + team assignments) is preserved - only results are cleared.
        const cleared = clearMatchResults(players, bracketData);
        setMatches(cleared.matches);
        setBracketData(cleared.bracketData);
        setPlayers(cleared.players);
        setShowClearMatchesWarning(false);
      };

      const fullReset = () => {
        setMatches([]);
        setBracketData(null);
        setPlayers([]);
        setShowFullResetWarning(false);
      };

      const completedMatchesList = getCompletedMatchesList(matches, bracketData, tournamentName, startDate);

      // --- EXPORT TO EXCEL (CSV) ---
      const exportToCSV = () => {
        const csv = buildCsv(completedMatchesList, startDate);
        if (!csv) {
          alert("No completed match data available to export yet.");
          return;
        }
        downloadCsv(csv, csvFileName(tournamentName, startDate));
      };

      // --- MATCH DRAWING & DELETION ---
      const handleDrawMatch = () => {
        const result = drawMonsterMatch({ players, matches, tableCount, format, maxGames, id: Date.now() });
        if (result.error) {
          alert(result.error);
          return;
        }
        setPlayers(result.players);
        setMatches(result.matches);
      };

      const handleDeleteMatch = (matchId) => {
        if (confirm('Are you sure you want to delete this match? Table will be freed.')) {
          setMatches(deleteMatch(matches, matchId));
        }
      };

      // --- SCORE ENTRY & MATCH COMPLETION ---
      const handleGameScoreChange = (matchId, gameIndex, teamKey, value) => {
        setMatches(updateMonsterGameScore(matches, matchId, gameIndex, teamKey, value));
      };

      const handleHandicapToggle = (matchId, checked) => {
        setMatches(setMonsterHandicap(matches, matchId, checked));
      };

      const handleOverrideWinnerChange = (matchId, winner) => {
        setMatches(setMonsterOverrideWinner(matches, matchId, winner));
      };

      const completeMatch = (matchId) => {
        const result = completeMonsterMatch(players, matches, matchId);
        if (!result) return;
        if (result.error) {
          alert(result.error);
          return;
        }
        setPlayers(result.players);
        setMatches(result.matches);
      };

      const sortedPlayers = computeStandings(players);

      const initManualTeams = (teamCount, currentFormat) => {
        setCustomTeams(buildManualTeams(sortedPlayers, teamCount, currentFormat));
      };

      const openBracketModal = () => {
        initManualTeams(bracketTeamCount, format);
        setShowBracketModal(true);
      };

      const handleDrawBracketsClick = () => {
        if (hasPausedPlayers(players)) {
          setShowPausedWarningModal(true);
        } else {
          openBracketModal();
        }
      };

      const handleGenerateBracket = () => {
        const result = createBracket({
          rankedPlayers: sortedPlayers,
          teamCount: bracketTeamCount,
          format,
          teamFormationStrategy,
          seedingStrategy,
          customTeams,
          leaderboardPlayers,
          elimType: bracketElimType,
          maxGames: bracketMaxGames
        });
        if (result.error) {
          alert(result.error);
          return;
        }

        setBracketData(result.bracket);
        setShowBracketModal(false);
        setActiveTab('bracket');
      };

      const handleBracketScoreChange = (bracketSection, rIdx, mIdx, gIdx, teamKey, val) => {
        setBracketData(updateBracketGameScore(bracketData, bracketSection, rIdx, mIdx, gIdx, teamKey, val));
      };

      const handleBracketHandicapToggle = (bracketSection, rIdx, mIdx, checked) => {
        setBracketData(setBracketHandicap(bracketData, bracketSection, rIdx, mIdx, checked));
      };

      const handleBracketOverrideWinnerChange = (bracketSection, rIdx, mIdx, winner) => {
        setBracketData(setBracketOverrideWinner(bracketData, bracketSection, rIdx, mIdx, winner));
      };

      const handleConfirmBracketMatch = (bracketSection, rIdx, mIdx) => {
        const result = confirmBracketMatch(bracketData, bracketSection, rIdx, mIdx);
        if (result.error) {
          alert(result.error);
          return;
        }
        if (result.finished) {
          setShowWinnerModal(true);
        }
        setBracketData(result.bracket);
      };

      const bracketStandings = calculateBracketStandings(bracketData);

      // Assign tables dynamically to ready/active matches without reassigning established tables
      const bracketReadyMatches = assignBracketTables(bracketData, tableCount);

      return (
        <div className="flex flex-col min-h-screen">
          
          {/* Official Website Style Header (White Bar) */}
          <header className="bg-white text-gray-900 border-b border-gray-200 sticky top-0 z-40 shadow-sm">
            <div className="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center gap-4 flex-nowrap">
              <a 
                href="https://calgaryfoosballclub.com/" 
                target="_blank" 
                rel="noopener noreferrer"
                className="flex items-center gap-2 sm:gap-3 hover:opacity-90 transition-opacity h-8 sm:h-12 flex-shrink-0 min-w-0"
              >
                <img 
                  src="https://calgaryfoosballclub.com/assets/cfc-logo-wide.png" 
                  alt="Calgary Foosball Club Crest" 
                  className="h-full w-auto object-contain flex-shrink-0"
                  onError={(e) => {
                    e.target.onerror = null; 
                    e.target.style.display = 'none';
                  }}
                />
                <div className="border-l border-gray-300 pl-2 sm:pl-3 flex flex-col justify-center h-full flex-1 min-w-0">
                  <h1 className="text-[11px] xs:text-[12px] sm:text-[13px] lg:text-[14px] font-bold tracking-normal text-gray-700 uppercase leading-tight whitespace-nowrap overflow-hidden text-ellipsis">
                    Tournament Control Desk
                  </h1>
                </div>
              </a>

              {/* Hamburger Button */}
              <button 
                onClick={() => setIsMobileMenuOpen(!isMobileMenuOpen)}
                className="lg:hidden bg-gray-100 hover:bg-gray-200 text-gray-800 border border-gray-300 font-bold px-3 py-1.5 text-xs rounded flex items-center gap-1 transition flex-shrink-0"
                aria-label="Toggle Navigation Menu"
              >
                <span>☰</span>
              </button>

              {/* Action Buttons */}
              <div className="hidden lg:flex items-center gap-2.5 flex-shrink-0 whitespace-nowrap">
                <button 
                  onClick={exportToCSV}
                  className="bg-green-200 hover:bg-green-300 text-green-800 font-bold px-3 py-2 text-xs uppercase tracking-wider rounded border border-green-600 flex items-center gap-1.5 transition"
                  title="Export match results to Excel CSV"
                >
                  <span>📊</span> CSV Export
                </button>

                <button
                  onClick={handleDrawBracketsClick}
                  disabled={isLocked}
                  className="bg-cfc-red hover:bg-cfc-redHover text-white font-black px-4 py-2 text-xs uppercase tracking-widest rounded shadow transition disabled:opacity-40 disabled:cursor-not-allowed disabled:hover:bg-cfc-red"
                >
                  🏆 Draw Brackets
                </button>

                {!isLocked ? (
                  <button
                    onClick={() => setShowPinModal(true)}
                    className="bg-gray-900 hover:bg-black text-white text-xs px-3 py-2 rounded font-bold uppercase tracking-wider transition"
                  >
                    🔓 Admin Lock
                  </button>
                ) : (
                  <button
                    onClick={() => setShowPinModal(true)}
                    className="bg-rose-700 hover:bg-rose-800 text-white text-xs px-3 py-2 rounded font-bold uppercase tracking-wider transition"
                  >
                    🔒 View Only (Unlock)
                  </button>
                )}
              </div>
            </div>

            {/* Mobile Dropdown Menu */}
            {isMobileMenuOpen && (
              <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex justify-center items-start pt-16 p-4 lg:hidden">
                <div className="bg-cfc-panel border border-cfc-border rounded-xl p-5 w-full max-w-sm space-y-4 shadow-2xl relative">
                  <div className="flex justify-between items-center border-b border-cfc-border pb-3">
                    <h3 className="text-white font-black uppercase text-sm tracking-wider">Tournament Options</h3>
                    <button 
                      onClick={() => setIsMobileMenuOpen(false)}
                      className="text-gray-400 hover:text-white text-lg font-bold px-2 py-0.5 rounded"
                      aria-label="Close menu"
                    >
                      ✕
                    </button>
                  </div>

                  <div className="flex flex-col gap-3">
                    <button 
                      onClick={() => { exportToCSV(); setIsMobileMenuOpen(false); }}
                      className="w-full bg-green-200 hover:bg-green-300 text-green-800 font-bold px-4 py-3 text-xs uppercase tracking-wider rounded border border-green-600 flex items-center justify-center gap-2 transition"
                    >
                      <span>📊</span> CSV Export
                    </button>

                    <button
                      onClick={() => { setIsMobileMenuOpen(false); handleDrawBracketsClick(); }}
                      disabled={isLocked}
                      className="w-full bg-cfc-red hover:bg-cfc-redHover text-white font-black px-4 py-3 text-xs uppercase tracking-widest rounded shadow transition text-center disabled:opacity-40 disabled:cursor-not-allowed disabled:hover:bg-cfc-red"
                    >
                      🏆 Draw Brackets
                    </button>

                    {!isLocked ? (
                      <button
                        onClick={() => { setIsMobileMenuOpen(false); setShowPinModal(true); }}
                        className="w-full bg-gray-900 hover:bg-black text-white text-xs py-3 rounded font-bold uppercase tracking-wider transition text-center border border-gray-700"
                      >
                        🔓 Admin Lock
                      </button>
                    ) : (
                      <button
                        onClick={() => { setIsMobileMenuOpen(false); setShowPinModal(true); }}
                        className="w-full bg-rose-700 hover:bg-rose-800 text-white text-xs py-3 rounded font-bold uppercase tracking-wider transition text-center"
                      >
                        🔒 View Only (Unlock)
                      </button>
                    )}
                  </div>

                  <button 
                    onClick={() => setIsMobileMenuOpen(false)}
                    className="w-full mt-2 bg-cfc-dark hover:bg-cfc-panelLight border border-cfc-border text-gray-300 text-xs py-2 rounded font-semibold transition"
                  >
                    Close
                  </button>
                </div>
              </div>
            )}
          </header>

          {/* Main Dashboard Container */}
          <main className="max-w-6xl w-full mx-auto p-4 sm:p-6 space-y-8 flex-1">

            {isLocked && (
              <div className="bg-rose-950/60 border border-rose-700 text-rose-200 text-xs font-bold uppercase tracking-wider px-4 py-2.5 rounded-lg flex items-center gap-2">
                <span>👁</span> View Only Mode — editing is disabled. Click "View Only (Unlock)" and enter the PIN to resume editing.
              </div>
            )}

            {showPinModal && (
              <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                <div className="bg-cfc-panel border border-cfc-border p-6 rounded-xl max-w-sm w-full space-y-4 shadow-2xl">
                  <h3 className="text-lg font-bold text-cfc-red flex items-center gap-2">

                              <div className="flex gap-6 items-start pt-2">
                                <div className="w-80">
                                  <MatchCard 
                                    match={bracketData.grandFinals[0]} 
                                    onScoreChange={(gIdx, key, val) => handleBracketScoreChange('grandFinals', 0, 0, gIdx, key, val)}
                                    onHandicapToggle={(checked) => handleBracketHandicapToggle('grandFinals', 0, 0, checked)}
                                    onOverrideWinnerChange={(winner) => handleBracketOverrideWinnerChange('grandFinals', 0, 0, winner)}
                                    onConfirm={() => handleConfirmBracketMatch('grandFinals', 0, 0)}
                                    locked={isLocked}
                                  />
                                </div>
                              </div>
                            </div>
                          )}

                          {bracketData.thirdPlaceMatch && (
                            <div className="space-y-3">
                              <h3 className="text-base font-black text-amber-400 uppercase tracking-wider border-b border-cfc-border pb-1">3rd Place Match</h3>
                              <div className="flex gap-6 items-start pt-2">
                                <div className="w-80">
                                  <MatchCard 
                                    match={bracketData.thirdPlaceMatch} 
                                    onScoreChange={(gIdx, key, val) => handleBracketScoreChange('thirdPlace', 0, 0, gIdx, key, val)}
                                    onHandicapToggle={(checked) => handleBracketHandicapToggle('thirdPlace', 0, 0, checked)}
                                    onOverrideWinnerChange={(winner) => handleBracketOverrideWinnerChange('thirdPlace', 0, 0, winner)}
                                    onConfirm={() => handleConfirmBracketMatch('thirdPlace', 0, 0)}
                                    locked={isLocked}
                                  />
                                </div>
                              </div>
                            </div>
                          )}
                        </div>
                      )}

                      {(bracketData.type === 'double' || bracketData.type === 'championship') && bracketData.losersRounds && bracketData.losersRounds.length > 0 && (
                        <div className="space-y-3 pt-6 border-t border-cfc-border">
                          <h3 className="text-base font-black text-rose-400 uppercase tracking-wider border-b border-cfc-border pb-1">Losers Bracket</h3>
                          <div className="flex gap-8 items-stretch min-w-max pt-2">
                            {bracketData.losersRounds.map((roundMatches, rIdx) => (
                              <div key={rIdx} className="flex flex-col justify-around gap-6 w-72">
                                <h4 className="text-[11px] font-bold text-gray-400 uppercase tracking-wider text-center border-b border-cfc-border pb-1">
                                  Losers Round {rIdx + 1}
                                </h4>

                                {roundMatches.map((match, mIdx) => (
                                  <MatchCard 
                                    key={match.id} 
                                    match={match} 
                                    onScoreChange={(gIdx, key, val) => handleBracketScoreChange('losers', rIdx, mIdx, gIdx, key, val)}
                                    onHandicapToggle={(checked) => handleBracketHandicapToggle('losers', rIdx, mIdx, checked)}
                                    onOverrideWinnerChange={(winner) => handleBracketOverrideWinnerChange('losers', rIdx, mIdx, winner)}
                                    onConfirm={() => handleConfirmBracketMatch('losers', rIdx, mIdx)}
                                    locked={isLocked}
                                  />
                                ))}
                              </div>
                            ))}
                          </div>
                        </div>
                      )}

                      {bracketData.type === 'double' && bracketData.grandFinals && (
                        <div className="space-y-3 pt-6 border-t border-cfc-border">
                          <h3 className="text-base font-black text-cfc-red uppercase tracking-wider border-b border-cfc-border pb-1">Grand Finals</h3>
                          <div className="flex gap-6 items-start pt-2">
                            {bracketData.grandFinals.map((gfMatch, gfIdx) => (
                              <div key={gfMatch.id} className="w-80">
                                <MatchCard
                                  match={gfMatch}
                                  onScoreChange={(gIdx, key, val) => handleBracketScoreChange('grandFinals', 0, gfIdx, gIdx, key, val)}
                                  onHandicapToggle={(checked) => handleBracketHandicapToggle('grandFinals', 0, gfIdx, checked)}
                                  onOverrideWinnerChange={(winner) => handleBracketOverrideWinnerChange('grandFinals', 0, gfIdx, winner)}
                                  onConfirm={() => handleConfirmBracketMatch('grandFinals', 0, gfIdx)}
                                  locked={isLocked}
                                />
                              </div>
                            ))}
                          </div>
                        </div>
                      )}

                      {bracketData.type === 'championship' && (
                        <div className="space-y-3 pt-6 border-t border-cfc-border">
                          <h3 className="text-base font-black text-cfc-red uppercase tracking-wider border-b border-cfc-border pb-1">Grand Finals</h3>
                          <p className="text-[11px] text-gray-500 italic">
                            Championship Format: this is the Winners Bracket final - its winner takes 1st, runner-up takes 2nd.
                          </p>
                          <div className="flex gap-6 items-start pt-2">
                            <div className="w-80">
                              <MatchCard
                                match={bracketData.winnersRounds[bracketData.winnersRounds.length - 1][0]}
                                onScoreChange={(gIdx, key, val) => handleBracketScoreChange('winners', bracketData.winnersRounds.length - 1, 0, gIdx, key, val)}
                                onHandicapToggle={(checked) => handleBracketHandicapToggle('winners', bracketData.winnersRounds.length - 1, 0, checked)}
                                onOverrideWinnerChange={(winner) => handleBracketOverrideWinnerChange('winners', bracketData.winnersRounds.length - 1, 0, winner)}
                                onConfirm={() => handleConfirmBracketMatch('winners', bracketData.winnersRounds.length - 1, 0)}
                                locked={isLocked}
                              />
                            </div>
                          </div>
                        </div>
                      )}
                    </div>
                  </div>
                )}
              </div>
            )}

          </main>

          {/* Footer */}
          <footer className="bg-cfc-panel border-t border-cfc-border py-4 text-center text-xs text-gray-400 font-mono">
            <p>Tournament Manager <span className="text-cfc-red font-bold ml-1">v1.4.27</span></p>
            <p>Calgary Foosball Club is a registered non-profit </p>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<FoosballApp />);
  </script>
</body>
</html>
