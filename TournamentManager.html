                        >
                          Reset / Redraw Brackets
                        </button>
                      </div>
                    </div>

                    {/* LIVE TABLE MATCHES - BRACKET STAGE */}
                    <div>
                      <h2 className="text-xl font-black mb-4 text-white uppercase tracking-wide flex items-center gap-2">
                        <span className="text-cfc-red">●</span> LIVE TABLE MATCHES
                      </h2>
                      <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                        {Array.from({ length: tableCount }).map((_, idx) => {
                          const tableNum = idx + 1;
                          const assignedItem = bracketReadyMatches[idx];

                          return (
                            <div key={tableNum} className="bg-cfc-panel rounded-xl border border-cfc-border p-5 space-y-4 shadow-lg">
                              <div className="flex justify-between items-center border-b border-cfc-border pb-3">
                                <span className="font-black text-lg text-white uppercase tracking-wider flex items-center gap-2">
                                  <span className="text-cfc-red">●</span> Table #{tableNum}
                                </span>
                                <span className={`text-[11px] px-2.5 py-0.5 rounded font-bold uppercase tracking-wider ${assignedItem ? 'bg-cfc-red text-white animate-pulse' : 'bg-cfc-dark text-gray-500 border border-cfc-border'}`}>
                                  {assignedItem ? 'MATCH IN PROGRESS' : 'FREE'}
                                </span>
                              </div>

                              {assignedItem ? (
                                <MatchCard 
                                  match={assignedItem.match}
                                  onScoreChange={(gIdx, key, val) => handleBracketScoreChange(assignedItem.section, assignedItem.rIdx, assignedItem.mIdx, gIdx, key, val)}
                                  onHandicapToggle={(checked) => handleBracketHandicapToggle(assignedItem.section, assignedItem.rIdx, assignedItem.mIdx, checked)}
                                  onOverrideWinnerChange={(winner) => handleBracketOverrideWinnerChange(assignedItem.section, assignedItem.rIdx, assignedItem.mIdx, winner)}
                                  onConfirm={() => confirmBracketMatch(assignedItem.section, assignedItem.rIdx, assignedItem.mIdx)}
                                  locked={isLocked}
                                />
                              ) : (
                                <p className="text-gray-500 text-xs italic py-8 text-center uppercase tracking-wider">
                                  Table available for playoff match
                                </p>
                              )}
                            </div>
                          );
                        })}
                      </div>
                    </div>

                    {/* BRACKET VIEW VISUALIZATION */}
                    <div className="bg-cfc-panel rounded-xl border border-cfc-border p-6 overflow-x-auto space-y-8 shadow-lg">
                      <div className="border-b border-cfc-border pb-4">
                        <h2 className="text-2xl font-black text-white uppercase tracking-wide flex items-center gap-2">
                          <span className="text-cfc-red">🏆</span> BRACKET VIEW
                        </h2>
                      </div>

                      <div className="space-y-3">
                        <h3 className="text-base font-black text-white uppercase tracking-wider border-b border-cfc-border pb-1">Winners Bracket</h3>
                        <div className="flex gap-8 items-stretch min-w-max pt-2">
                          {(bracketData.type === 'championship' ? bracketData.winnersRounds.slice(0, -1) : bracketData.winnersRounds).map((roundMatches, rIdx) => (
                            <div key={rIdx} className="flex flex-col justify-around gap-6 w-72">
                              <h4 className="text-[11px] font-bold text-gray-400 uppercase tracking-wider text-center border-b border-cfc-border pb-1">
                                Round {rIdx + 1}
                              </h4>

                              {roundMatches.map((match, mIdx) => (
                                <MatchCard 
                                  key={match.id} 
                                  match={match} 
                                  onScoreChange={(gIdx, key, val) => handleBracketScoreChange('winners', rIdx, mIdx, gIdx, key, val)}
                                  onHandicapToggle={(checked) => handleBracketHandicapToggle('winners', rIdx, mIdx, checked)}
                                  onOverrideWinnerChange={(winner) => handleBracketOverrideWinnerChange('winners', rIdx, mIdx, winner)}
                                  onConfirm={() => confirmBracketMatch('winners', rIdx, mIdx)}
                                  locked={isLocked}
                                />
                              ))}
                            </div>
                          ))}
                        </div>
                      </div>

                      {bracketData.type === 'single' && (
                        <div className="space-y-6 pt-6 border-t border-cfc-border">
                          {bracketData.grandFinals && (
                            <div className="space-y-3">
                              <h3 className="text-base font-black text-cfc-red uppercase tracking-wider border-b border-cfc-border pb-1">Grand Finals</h3>
                              <div className="flex gap-6 items-start pt-2">
                                <div className="w-80">
                                  <MatchCard 
                                    match={bracketData.grandFinals[0]} 
                                    onScoreChange={(gIdx, key, val) => handleBracketScoreChange('grandFinals', 0, 0, gIdx, key, val)}
                                    onHandicapToggle={(checked) => handleBracketHandicapToggle('grandFinals', 0, 0, checked)}
                                    onOverrideWinnerChange={(winner) => handleBracketOverrideWinnerChange('grandFinals', 0, 0, winner)}
                                    onConfirm={() => confirmBracketMatch('grandFinals', 0, 0)}
                                    locked={isLocked}
                                  />
                                </div>
                              </div>
                            </div>
                          )}

                          {bracketData.thirdPlaceMatch && (
                            <div className="space-y-3">
                              <h3 className="text-base font-black text-amber-400 uppercase tracking-wider border-b border-cfc-border pb-1">3rd Place Match</h3>
                              <div className="flex gap-6 items-start pt-2">
                                <div className="w-80">
                                  <MatchCard 
                                    match={bracketData.thirdPlaceMatch} 
                                    onScoreChange={(gIdx, key, val) => handleBracketScoreChange('thirdPlace', 0, 0, gIdx, key, val)}
                                    onHandicapToggle={(checked) => handleBracketHandicapToggle('thirdPlace', 0, 0, checked)}
                                    onOverrideWinnerChange={(winner) => handleBracketOverrideWinnerChange('thirdPlace', 0, 0, winner)}
                                    onConfirm={() => confirmBracketMatch('thirdPlace', 0, 0)}
                                    locked={isLocked}
                                  />
                                </div>
                              </div>
                            </div>
                          )}
                        </div>
                      )}

                      {(bracketData.type === 'double' || bracketData.type === 'championship') && bracketData.losersRounds && bracketData.losersRounds.length > 0 && (
                        <div className="space-y-3 pt-6 border-t border-cfc-border">
                          <h3 className="text-base font-black text-rose-400 uppercase tracking-wider border-b border-cfc-border pb-1">Losers Bracket</h3>
                          <div className="flex gap-8 items-stretch min-w-max pt-2">
                            {bracketData.losersRounds.map((roundMatches, rIdx) => (
                              <div key={rIdx} className="flex flex-col justify-around gap-6 w-72">
                                <h4 className="text-[11px] font-bold text-gray-400 uppercase tracking-wider text-center border-b border-cfc-border pb-1">
                                  Losers Round {rIdx + 1}
                                </h4>

                                {roundMatches.map((match, mIdx) => (
                                  <MatchCard 
                                    key={match.id} 
                                    match={match} 
                                    onScoreChange={(gIdx, key, val) => handleBracketScoreChange('losers', rIdx, mIdx, gIdx, key, val)}
                                    onHandicapToggle={(checked) => handleBracketHandicapToggle('losers', rIdx, mIdx, checked)}
                                    onOverrideWinnerChange={(winner) => handleBracketOverrideWinnerChange('losers', rIdx, mIdx, winner)}
                                    onConfirm={() => confirmBracketMatch('losers', rIdx, mIdx)}
                                    locked={isLocked}
                                  />
                                ))}
                              </div>
                            ))}
                          </div>
                        </div>
                      )}

                      {bracketData.type === 'double' && bracketData.grandFinals && (
                        <div className="space-y-3 pt-6 border-t border-cfc-border">
                          <h3 className="text-base font-black text-cfc-red uppercase tracking-wider border-b border-cfc-border pb-1">Grand Finals</h3>
                          <div className="flex gap-6 items-start pt-2">
                            {bracketData.grandFinals.map((gfMatch, gfIdx) => (
                              <div key={gfMatch.id} className="w-80">
                                <MatchCard
                                  match={gfMatch}
                                  onScoreChange={(gIdx, key, val) => handleBracketScoreChange('grandFinals', 0, gfIdx, gIdx, key, val)}
                                  onHandicapToggle={(checked) => handleBracketHandicapToggle('grandFinals', 0, gfIdx, checked)}
                                  onOverrideWinnerChange={(winner) => handleBracketOverrideWinnerChange('grandFinals', 0, gfIdx, winner)}
                                  onConfirm={() => confirmBracketMatch('grandFinals', 0, gfIdx)}
                                  locked={isLocked}
                                />
                              </div>
                            ))}
                          </div>
                        </div>
                      )}

                      {bracketData.type === 'championship' && (
                        <div className="space-y-3 pt-6 border-t border-cfc-border">
                          <h3 className="text-base font-black text-cfc-red uppercase tracking-wider border-b border-cfc-border pb-1">Grand Finals</h3>
                          <p className="text-[11px] text-gray-500 italic">
                            Championship Format: this is the Winners Bracket final - its winner takes 1st, runner-up takes 2nd.
                          </p>
                          <div className="flex gap-6 items-start pt-2">
                            <div className="w-80">
                              <MatchCard
                                match={bracketData.winnersRounds[bracketData.winnersRounds.length - 1][0]}
                                onScoreChange={(gIdx, key, val) => handleBracketScoreChange('winners', bracketData.winnersRounds.length - 1, 0, gIdx, key, val)}
                                onHandicapToggle={(checked) => handleBracketHandicapToggle('winners', bracketData.winnersRounds.length - 1, 0, checked)}
                                onOverrideWinnerChange={(winner) => handleBracketOverrideWinnerChange('winners', bracketData.winnersRounds.length - 1, 0, winner)}
                                onConfirm={() => confirmBracketMatch('winners', bracketData.winnersRounds.length - 1, 0)}
                                locked={isLocked}
                              />
                            </div>
                          </div>
                        </div>
                      )}
                    </div>
                  </div>
                )}
              </div>
            )}

          </main>

          {/* Footer */}
          <footer className="bg-cfc-panel border-t border-cfc-border py-4 text-center text-xs text-gray-400 font-mono">
            <p>Tournament Manager <span className="text-cfc-red font-bold ml-1">v1.4.27</span></p>
            <p>Calgary Foosball Club is a registered non-profit </p>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<FoosballApp />);
  </script>
</body>
</html>
